<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>سَليم — افحص قبل أن تنشر</title>
    <meta
      name="description"
      content="سَليم يفحص إعلانك أو منشورك قبل نشره، ويقول لك أين المشكلة وكيف تصلحها."
    />
    <script>
      // The prerendered snapshot is Arabic; English visitors get the SPA only.
      try {
        if (localStorage.getItem("saleem-lang") === "en") {
          document.documentElement.lang = "en";
          document.documentElement.dir = "ltr";
          document.addEventListener("DOMContentLoaded", function () {
            var p = document.getElementById("prerender");
            if (p) p.remove();
          });
        }
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
